name: control-plane-image

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-image.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-image.yml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build OCI image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          push: false
          tags: gitgat-control-plane:ci
          load: true
      - name: Verify image runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id gitgat-control-plane:ci -u)"
          test "$uid" != "0"
