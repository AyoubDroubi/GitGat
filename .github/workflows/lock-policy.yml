name: gitgat-lock-policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gitgat-lock-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-lock-policy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - name: Prepare Git LFS
        run: |
          git lfs version
          git lfs install --local
          git fetch origin "${{ github.base_ref }}"

      - name: Evaluate protected-file lock policy
        env:
          BASE_REF: origin/${{ github.base_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          cargo run --release -- \
            --check-lock-policy \
            --base "$BASE_REF" \
            --actor "$ACTOR" | tee gitgat-lock-policy.json
          jq -e --arg expected "${{ github.event.pull_request.head.sha }}" '.head_sha == $expected' gitgat-lock-policy.json

      - name: Publish policy summary
        if: always()
        shell: bash
        run: |
          echo "## GitGat Lock Policy" >> "$GITHUB_STEP_SUMMARY"
          if [ -f gitgat-lock-policy.json ]; then
            cat gitgat-lock-policy.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Policy evaluation did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
