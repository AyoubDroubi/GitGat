name: package-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package
        required: false
        default: 0.1.0
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/package-windows.yml"
      - "packaging/windows/**"
      - "scripts/package-windows.ps1"
      - "src/GitGat.Desktop/GitGat.Desktop.csproj"
      - "src/GitGat.Desktop/Assets/gitgat.ico"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}".TrimStart("v")
            } else {
              $version = "0.1.0"
            }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test, publish, smoke launch and package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GitGat-${{ steps.version.outputs.value }}-win-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/publish/win-x64/GitGat.exe
            artifacts/installer/*.exe
            artifacts/checksums/SHA256SUMS.txt
