name: control-plane-quality

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-quality.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gitgat
          POSTGRES_PASSWORD: gitgat
          POSTGRES_DB: gitgat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitgat -d gitgat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gitgat:gitgat@localhost:5432/gitgat_test
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-plane
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Prove migrations against PostgreSQL
        run: |
          cargo run >/tmp/gitgat-control-plane.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gitgat-control-plane.log
          exit 1

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@cargo-audit
      - name: Prove advisory is outside the active build graph
        run: |
          if cargo tree --edges normal -i rsa 2>/dev/null | grep -q '^rsa '; then
            echo "rsa is active in the Control Plane dependency graph"
            cargo tree --edges normal -i rsa
            exit 1
          fi
          echo "rsa is lock-only through an inactive optional database driver"
      - name: Dependency audit
        run: cargo audit --ignore RUSTSEC-2023-0071
