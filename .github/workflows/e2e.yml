name: e2e-gitgat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/e2e_git.rs"
      - ".github/workflows/e2e.yml"
      - "src/git.rs"
      - "src/forge.rs"
      - "src/process.rs"
      - "src/store.rs"
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: e2e-gitgat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-git:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - name: Full local Git E2E
        run: cargo test --test e2e_git -- --test-threads=1

  live-github:
    if: github.event_name != 'pull_request'
    needs: local-git
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify GitHub and Git LFS clients
        run: |
          gh auth status
          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
          git lfs version

      - name: Clean stale E2E resources
        shell: bash
        run: |
          set -u
          git lfs locks --json > /tmp/stale-locks.json || true
          jq -r '.[]? | select(.path == "e2e/live-lock.bin" or (.path | startswith("e2e/live-lock-"))) | .id' /tmp/stale-locks.json |
            while read -r lock_id; do
              if [ -n "$lock_id" ]; then
                git lfs unlock --id="$lock_id" || git lfs unlock --force --id="$lock_id" || true
              fi
            done

          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/e2e/" --jq '.[].ref' |
            while read -r ref; do
              [ -z "$ref" ] && continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/${ref#refs/}" || true
            done

      - name: Create isolated live branches
        id: branches
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="e2e/${GITHUB_RUN_ID}/base"
          HEAD_BRANCH="e2e/${GITHUB_RUN_ID}/head"
          LOCK_PATH="e2e/live-lock-${GITHUB_RUN_ID}.bin"
          echo "base=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "lock_path=$LOCK_PATH" >> "$GITHUB_OUTPUT"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git branch "$BASE_BRANCH" "$GITHUB_SHA"
          git push origin "$BASE_BRANCH"
          git switch -c "$HEAD_BRANCH" "$GITHUB_SHA"

          mkdir -p e2e
          git lfs install --local
          git lfs track "$LOCK_PATH"
          printf 'GitGat live GitHub E2E run %s\n' "$GITHUB_RUN_ID" > e2e/live.txt
          printf 'lock validation %s\n' "$GITHUB_RUN_ID" > "$LOCK_PATH"
          git add .gitattributes e2e/live.txt "$LOCK_PATH"
          git commit -m "test(e2e): live GitHub validation $GITHUB_RUN_ID"
          git push -u origin "$HEAD_BRANCH"

      - name: Validate live Git LFS lock lifecycle
        shell: bash
        env:
          LOCK_PATH: ${{ steps.branches.outputs.lock_path }}
        run: |
          set -euo pipefail
          git lfs lock "$LOCK_PATH"
          git lfs locks --json | tee /tmp/locks.json
          jq -e --arg path "$LOCK_PATH" 'any(.[]?; .path == $path)' /tmp/locks.json
          git lfs unlock "$LOCK_PATH"
          git lfs locks --json | tee /tmp/locks-after.json
          jq -e --arg path "$LOCK_PATH" '([.[]? | select(.path == $path)] | length) == 0' /tmp/locks-after.json

      - name: Validate GitHub Actions visibility
        shell: bash
        run: |
          set -euo pipefail
          gh run list --limit 20 --json databaseId,name,status,conclusion,headBranch,url | tee /tmp/runs.json
          jq -e 'length > 0' /tmp/runs.json

      - name: Exercise PR flow when Actions identity is permitted
        id: pr
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.branches.outputs.base }}
          HEAD_BRANCH: ${{ steps.branches.outputs.head }}
        run: |
          set -euo pipefail
          set +e
          PR_OUTPUT=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "GitGat E2E live flow ${GITHUB_RUN_ID}" \
            --body "Temporary PR created by the GitGat E2E workflow. It validates live GitHub list/edit/comment/review plumbing without touching main or production." 2>&1)
          PR_STATUS=$?
          set -e

          if [ "$PR_STATUS" -ne 0 ]; then
            if printf '%s' "$PR_OUTPUT" | grep -Fq "GitHub Actions is not permitted to create or approve pull requests"; then
              echo "mode=policy-blocked" >> "$GITHUB_OUTPUT"
              {
                echo "## Live GitHub E2E"
                echo "- Git LFS lock/list/unlock: passed"
                echo "- GitHub Actions list/read: passed"
                echo "- PR automation from github-actions[bot]: skipped by repository policy"
                echo "- User-authenticated PR flow is validated separately."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$PR_OUTPUT" >&2
            exit "$PR_STATUS"
          fi

          PR_URL="$PR_OUTPUT"
          PR_NUMBER="${PR_URL##*/}"
          echo "mode=automated" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          gh pr list --head "$HEAD_BRANCH" --json number,title,state,headRefName,baseRefName,url | tee /tmp/pr-list.json
          jq -e --argjson n "$PR_NUMBER" 'any(.[]; .number == $n and .state == "OPEN")' /tmp/pr-list.json

          gh pr edit "$PR_NUMBER" \
            --title "GitGat E2E verified ${GITHUB_RUN_ID}" \
            --body "Live GitHub E2E: PR list/edit/comment/review target. Temporary branches are isolated from main and production."
          gh pr comment "$PR_NUMBER" --body "GitGat E2E conversation comment: ${GITHUB_RUN_ID}"
          gh pr review "$PR_NUMBER" --comment --body "GitGat E2E review comment: ${GITHUB_RUN_ID}"
          gh pr view "$PR_NUMBER" --json number,title,state,headRefName,baseRefName,url | tee /tmp/pr-view.json
          jq -e --argjson n "$PR_NUMBER" '.number == $n and .state == "OPEN"' /tmp/pr-view.json

      - name: Clean current live E2E resources
        if: always()
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.branches.outputs.base }}
          HEAD_BRANCH: ${{ steps.branches.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -u
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr close "$PR_NUMBER" || true
          fi
          for branch in "$HEAD_BRANCH" "$BASE_BRANCH"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true
          done

  cleanup-live-e2e:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.event.pull_request.base.ref, 'e2e/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Remove temporary E2E branches
        shell: bash
        run: |
          set -u
          for branch in "$HEAD_BRANCH" "$BASE_BRANCH"; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"; then
              echo "Deleted $branch"
            else
              echo "$branch was already deleted or could not be removed"
            fi
          done
