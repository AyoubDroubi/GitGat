name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GitGat.slnx

      - name: Build
        run: dotnet build GitGat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GitGat.slnx --configuration Release --no-build

      - name: Vulnerable package audit
        run: dotnet list GitGat.slnx package --vulnerable --include-transitive
