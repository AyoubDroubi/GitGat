[package]
name = "gitgat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A safe, native Git and GitHub desktop client built in Rust."
license = "MIT"

[dependencies]
anyhow = "1"
eframe = "0.36.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
