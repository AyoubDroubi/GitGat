# GitGat Azure Pipelines lock-policy template\n#\n# The caller must pass the canonical identity used by Git LFS for the PR author.\n# Keeping this explicit avoids unsafe display-name guessing. The provider adapter\n# will automate that identity mapping as the Azure live gate is completed.\n\nparameters:\n  - name: baseRef\n    type: string\n  - name: actor\n    type: string\n\nsteps:\n  - checkout: self\n    fetchDepth: 0\n    persistCredentials: true\n\n  - bash: |\n      set -euo pipefail\n      if [ -z '${{ parameters.baseRef }}' ]; then\n        echo "baseRef is required" >&2\n        exit 2\n      fi\n      if [ -z '${{ parameters.actor }}' ]; then\n        echo "actor is required and must match the Git LFS lock owner identity" >&2\n        exit 2\n      fi\n      git lfs version\n      git lfs install --local\n    displayName: Prepare Git LFS\n\n  - bash: |\n      set -euo pipefail\n      rustup toolchain install 1.98.1 --profile minimal\n      rustup default 1.98.1\n      cargo run --release -- \\n        --check-lock-policy \\n        --base '${{ parameters.baseRef }}' \\n        --actor '${{ parameters.actor }}' \\n        | tee gitgat-lock-policy.json\n    displayName: Evaluate GitGat lock policy\n\n  - publish: gitgat-lock-policy.json\n    artifact: gitgat-lock-policy\n    condition: always()\n    displayName: Publish lock-policy report\n